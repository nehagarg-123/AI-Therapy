version: "3.9"

services:

  backend:
    build: ./backend
    container_name: ai-therapy-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-therapy-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped

  ml-service:
    build: ./ml_service
    container_name: ai-therapy-ml
    ports:
      - "8000:8000"
    restart: unless-stopped