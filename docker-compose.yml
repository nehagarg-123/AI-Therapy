version: "3.9"

services:

  backend:
    build: ./backend
    container_name: ai-therapy-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - ml-service
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-therapy-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped

  ml-service:
    build: ./ml_service
    container_name: ai-therapy-ml
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-therapy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
